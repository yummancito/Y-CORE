<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Y-CORE — Catálogo de Errores</title>
<style>
  /* ==========================================================
     Design tokens (match Y-CORE palette)
     ========================================================== */
  :root {
    --bg: #0a0a0f;
    --bg-elevated: #13131a;
    --bg-card: #1a1a24;
    --bg-card-hover: #21212c;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text-bright: #ffffff;
    --text-primary: #e6e6ef;
    --text-secondary: #a8a8b8;
    --text-dim: #6b6b7c;
    --accent: #6366f1;
    --accent-bright: #818cf8;
    --accent-dark: #4f46e5;
    --status-error: #ef4444;
    --status-error-bg: rgba(239, 68, 68, 0.12);
    --status-warning: #f59e0b;
    --status-warning-bg: rgba(245, 158, 11, 0.12);
    --status-info: #3b82f6;
    --status-info-bg: rgba(59, 130, 246, 0.12);
    --status-critical: #ec4899;
    --status-critical-bg: rgba(236, 72, 153, 0.12);
    --status-success: #10b981;
    --status-success-bg: rgba(16, 185, 129, 0.12);
    --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 24px rgba(99, 102, 241, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  code, pre, .mono {
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 12px;
  }

  /* ==========================================================
     Layout
     ========================================================== */
  .app {
    display: grid;
    grid-template-rows: auto auto 1fr;
    min-height: 100vh;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: linear-gradient(180deg, rgba(10, 10, 15, 0.95) 0%, rgba(10, 10, 15, 0.85) 100%);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-glow);
    font-weight: 800;
    font-size: 18px;
    color: white;
  }
  .brand-text { line-height: 1.2; }
  .brand-name { font-weight: 700; color: var(--text-bright); font-size: 16px; letter-spacing: -0.01em; }
  .brand-subtitle { color: var(--text-dim); font-size: 11px; }

  .search-wrap {
    flex: 1;
    max-width: 480px;
    position: relative;
  }
  .search-input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 10px 14px 10px 38px;
    border-radius: 10px;
    font-size: 13px;
    transition: all 0.2s ease;
  }
  .search-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
  }

  .header-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .icon-btn:hover {
    background: var(--bg-card);
    border-color: var(--accent);
    color: var(--text-bright);
  }

  /* Stats bar */
  .stats {
    padding: 16px 28px 0;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .stat-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.15s ease;
  }
  .stat-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .stat-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }
  .stat-value {
    color: var(--text-bright);
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
  }
  .stat-label { color: var(--text-dim); font-size: 11px; }

  /* Filters */
  .filters {
    padding: 16px 28px;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label { color: var(--text-dim); font-size: 11px; margin-right: 4px; }
  .filter-pill {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .filter-pill:hover { border-color: var(--border-strong); color: var(--text-bright); }
  .filter-pill.active {
    background: rgba(99, 102, 241, 0.15);
    border-color: var(--accent);
    color: var(--accent-bright);
  }
  .filter-pill .pill-count {
    background: rgba(255, 255, 255, 0.06);
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 10px;
    color: var(--text-dim);
  }
  .filter-pill.active .pill-count {
    background: rgba(99, 102, 241, 0.3);
    color: var(--text-bright);
  }

  /* Main container */
  .main {
    padding: 8px 28px 60px;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
  }
  .results-info {
    color: var(--text-dim);
    font-size: 12px;
    padding: 8px 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .results-info strong { color: var(--text-primary); }

  /* ==========================================================
     Error cards
     ========================================================== */
  .error-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .error-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.18s ease;
    cursor: pointer;
  }
  .error-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-strong);
    transform: translateY(-1px);
    box-shadow: var(--shadow-card);
  }
  .error-card.expanded {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.3), var(--shadow-card);
  }

  .error-head {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
  }
  .error-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: rgba(255, 255, 255, 0.05);
    padding: 4px 8px;
    border-radius: 6px;
    color: var(--text-dim);
    white-space: nowrap;
    border: 1px solid var(--border);
  }
  .error-info { min-width: 0; }
  .error-title {
    font-weight: 600;
    color: var(--text-bright);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .error-message {
    color: var(--text-secondary);
    font-size: 12px;
    margin-top: 2px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }

  /* Screen-reader only utility */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Critical cards get a left accent */
  .error-card.sev-critical { border-left: 3px solid var(--status-critical); }
  .error-card.sev-error { border-left: 3px solid var(--status-error); }
  .error-card.sev-warning { border-left: 3px solid var(--status-warning); }
  .error-card.sev-info { border-left: 3px solid var(--status-info); }

  .error-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .error-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .badge-critical {
    background: var(--status-critical-bg);
    color: var(--status-critical);
    border-color: rgba(236, 72, 153, 0.3);
  }
  .badge-error {
    background: var(--status-error-bg);
    color: var(--status-error);
    border-color: rgba(239, 68, 68, 0.3);
  }
  .badge-warning {
    background: var(--status-warning-bg);
    color: var(--status-warning);
    border-color: rgba(245, 158, 11, 0.3);
  }
  .badge-info {
    background: var(--status-info-bg);
    color: var(--status-info);
    border-color: rgba(59, 130, 246, 0.3);
  }
  .badge-cat {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  /* Expanded body */
  .error-body {
    border-top: 1px solid var(--border);
    padding: 16px;
    display: none;
    background: rgba(0, 0, 0, 0.25);
  }
  .error-card.expanded .error-body { display: block; }
  .body-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .body-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .body-section.full { grid-column: 1 / -1; }
  .body-label {
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .body-value {
    color: var(--text-primary);
    font-size: 13px;
    line-height: 1.5;
  }
  .body-value.mono {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--border);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 11px;
    color: var(--text-secondary);
    word-break: break-word;
    white-space: pre-wrap;
  }
  .body-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .action-chip {
    background: rgba(99, 102, 241, 0.12);
    color: var(--accent-bright);
    border: 1px solid rgba(99, 102, 241, 0.25);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
  }
  .trigger-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .trigger-item {
    color: var(--text-secondary);
    font-size: 12px;
    padding-left: 14px;
    position: relative;
  }
  .trigger-item::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: var(--accent-bright);
  }
  .copy-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .copy-btn:hover {
    background: rgba(99, 102, 241, 0.18);
    border-color: var(--accent);
    color: var(--text-bright);
  }
  .copy-btn.copied {
    background: rgba(16, 185, 129, 0.18);
    border-color: var(--status-success);
    color: var(--status-success);
  }

  /* Empty state */
  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-dim);
  }
  .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.3;
  }

  /* Footer */
  .footer {
    border-top: 1px solid var(--border);
    padding: 20px 28px;
    color: var(--text-dim);
    font-size: 11px;
    text-align: center;
    background: rgba(0, 0, 0, 0.3);
  }
  .footer strong { color: var(--text-secondary); }

  /* ==========================================================
     Responsive
     ========================================================== */
  @media (max-width: 880px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .body-grid { grid-template-columns: 1fr; }
    .search-wrap { max-width: none; }
    .header-inner { flex-wrap: wrap; }
    .brand-subtitle { display: none; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.16); }

  /* Subtle entry animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .error-card { animation: fadeUp 0.25s ease both; }

/* ============================================================
   PROMINENT MESSAGE STYLE — make error message the headline
   ============================================================ */
.error-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: start;
  gap: 14px;
  padding: 14px 18px;
}
.error-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.error-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-dim);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.error-message {
  color: var(--text-bright);
  font-size: 17px;
  font-weight: 500;
  line-height: 1.45;
  margin: 0;
  display: block;
  word-break: break-word;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}
.error-card {
  border-top: 2px solid transparent;
  transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
}
.error-card:hover {
  border-top-color: var(--accent);
  transform: translateY(-2px);
}
.error-card.sev-critical .error-message { color: #fcd9e7; font-weight: 600; }
.error-card.sev-error .error-message { color: #fef3f4; font-weight: 600; }
.error-card.sev-warning .error-message { color: var(--text-bright); }
.error-card.sev-info .error-message { color: var(--text-bright); }

.error-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.error-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-dim);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.error-message {
  color: var(--text-bright);
  font-size: 17px;
  font-weight: 500;
  line-height: 1.45;
  margin: 0;
  display: block;
  word-break: break-word;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}
.error-card {
  border-top: 2px solid transparent;
  transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
}
.error-card:hover {
  border-top-color: var(--accent);
  transform: translateY(-2px);
}
.error-card.sev-critical .error-message { color: #fcd9e7; font-weight: 600; }
.error-card.sev-error .error-message { color: #fef3f4; font-weight: 600; }
.error-card.sev-warning .error-message { color: var(--text-bright); }
.error-card.sev-info .error-message { color: var(--text-bright); }

      "Fallback cuando ningún patrón de error-translator.ts matchea el mensaje"
    ]
  }
];

/* ============================================================
   STATE + DOM REFS
   ============================================================ */
const state = { severity: 'all', category: 'all', search: '' };

const grid           = document.getElementById('grid');
const searchInput    = document.getElementById('search');
const filters        = document.getElementById('filters');
const emptyState     = document.getElementById('empty-state');
const visibleCount   = document.getElementById('visible-count');
const totalCount     = document.getElementById('total-count');
const activeFiltersInfo = document.getElementById('active-filters-info');
const statTotal      = document.getElementById('stat-total');
const statCritical   = document.getElementById('stat-critical');
const statError      = document.getElementById('stat-error');
const statWarning    = document.getElementById('stat-warning');
const statInfo       = document.getElementById('stat-info');
const expandAll      = document.getElementById('expandAll');
const collapseAll    = document.getElementById('collapseAll');

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ============================================================
   STATS
   ============================================================ */
function updateStats() {
  const c = { critical: 0, error: 0, warning: 0, info: 0 };
  ALL_ERRORS.forEach(e => { c[e.severity] = (c[e.severity] || 0) + 1; });
  if (statTotal)     statTotal.textContent     = ALL_ERRORS.length;
  if (statCritical)  statCritical.textContent  = c.critical || 0;
  if (statError)     statError.textContent     = c.error || 0;
  if (statWarning)   statWarning.textContent   = c.warning || 0;
  if (statInfo)      statInfo.textContent      = c.info || 0;
  if (totalCount)    totalCount.textContent    = ALL_ERRORS.length;
}

/* ============================================================
   FILTERS (severity + category pills)
   ============================================================ */
function buildFilters() {
  const categories = [...new Set(ALL_ERRORS.map(e => e.category))].sort();
  const sevList = ['all', 'critical', 'error', 'warning', 'info'];

  const sevPills = sevList.map(s => {
    const cnt = s === 'all' ? ALL_ERRORS.length : ALL_ERRORS.filter(e => e.severity === s).length;
    const cls = 'filter-pill' + (state.severity === s ? ' active' : '');
    const lbl = s === 'all' ? 'Todas' : s;
    return `<button class="${cls}" data-type="sev" data-value="${s}"> ${lbl} <span class="pill-count">${cnt}</span></button>`;
  }).join('');

  const catPills = ['<button class="filter-pill' + (state.category === 'all' ? ' active' : '') + '" data-type="cat" data-value="all"> Todas <span class="pill-count">' + ALL_ERRORS.length + '</span></button>']
    .concat(categories.map(c => {
      const cnt = ALL_ERRORS.filter(e => e.category === c).length;
      const cls = 'filter-pill' + (state.category === c ? ' active' : '');
      return `<button class="${cls}" data-type="cat" data-value="${escapeHTML(c)}"> ${escapeHTML(c)} <span class="pill-count">${cnt}</span></button>`;
    }))
    .join('');

  if (filters) {
    filters.innerHTML =
      '<span class="filter-label">Severidad:</span>' + sevPills +
      '<span class="filter-label" style="margin-left:14px">Categoría:</span>' + catPills;

    filters.querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const t = pill.getAttribute('data-type');
        const v = pill.getAttribute('data-value');
        if (t === 'sev') state.severity = v;
        else if (t === 'cat') state.category = v;
        buildFilters();
        render();
      });
    });
  }
}

/* ============================================================
   CARD RENDER
   ============================================================ */
function matchError(e) {
  if (state.severity !== 'all' && e.severity !== state.severity) return false;
  if (state.category !== 'all' && e.category !== state.category) return false;
  if (state.search) {
    const q = state.search.toLowerCase();
    if (!JSON.stringify(e).toLowerCase().includes(q)) return false;
  }
  return true;
}

function errorCardHTML(e) {
  const sev = e.severity || 'info';
  const triggers = (e.triggers || [])
    .map(t => `<div class="trigger-item">${escapeHTML(t)}</div>`)
    .join('') || '<div class="trigger-item" style="opacity:0.4">— sin triggers documentados</div>';
  const actions = (e.actions || [])
    .map(a => `<span class="action-chip">${escapeHTML(a)}</span>`)
    .join('') || '<span class="action-chip" style="opacity:0.4">— sin acción UI</span>';
  const sourceShort = (e.source || '').split(/[\\/]/).pop() || '—';
  const code = e.code != null ? ` · ${e.code}` : '';
  return `
    <article class="error-card sev-${sev}" data-id="${escapeHTML(e.id)}" role="button" tabindex="0" aria-expanded="false">
      <header class="error-head">
        <span class="error-id">${escapeHTML(e.id)}${escapeHTML(code)}</span>
        <div class="error-info">
          <div class="error-title">
            <span class="badge badge-${sev}">${sev}</span>
            <span>${escapeHTML(e.title || '—')}</span>
          </div>
          <div class="error-message">${escapeHTML(e.message || '')}</div>
        </div>
        <div class="error-meta">
          <span class="badge badge-cat">${escapeHTML(e.category || '—')}</span>
          <span class="error-id">${escapeHTML(sourceShort)}</span>
        </div>
      </header>
      <div class="error-body">
        <div class="body-grid">
          <div class="body-section">
            <span class="body-label">Mensaje para el usuario</span>
            <div class="body-value">${escapeHTML(e.message || '—')}</div>
          </div>
          <div class="body-section">
            <span class="body-label">Detalle técnico (log)</span>
            <div class="body-value mono">${escapeHTML(e.technical || '—')}</div>
          </div>
          <div class="body-section full">
            <span class="body-label">Cuándo se dispara</span>
            <div class="trigger-list">${triggers}</div>
          </div>
          <div class="body-section">
            <span class="body-label">Acciones UI disponibles</span>
            <div class="body-actions">${actions}</div>
          </div>
          <div class="body-section">
            <span class="body-label">Origen en el código</span>
            <div class="body-value mono">${escapeHTML(e.source || '—')}</div>
          </div>
          <div class="body-section full">
            <button class="copy-btn" data-copy="${escapeHTML(e.id)}" type="button">Copiar JSON</button>
          </div>
        </div>
      </div>
    </article>`;
}

function render() {
  if (!grid || !emptyState || !visibleCount || !activeFiltersInfo) return;
  const filtered = ALL_ERRORS.filter(matchError);
  visibleCount.textContent = filtered.length;

  const bits = [];
  if (state.severity !== 'all') bits.push('severidad: ' + state.severity);
  if (state.category !== 'all') bits.push('categoría: ' + state.category);
  if (state.search) bits.push('búsqueda: "' + state.search + '"');
  activeFiltersInfo.textContent = bits.length ? 'Filtros activos · ' + bits.join(' · ') : '';

  if (filtered.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';
  grid.innerHTML = filtered.map(errorCardHTML).join('');

  // attach card handlers
  grid.querySelectorAll('.error-card').forEach(card => {
    const toggle = () => {
      const expanded = card.classList.toggle('expanded');
      card.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    };
    card.addEventListener('click', (e) => {
      if (e.target && typeof e.target.closest === 'function' && e.target.closest('.copy-btn')) return;
      toggle();
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggle();
      }
    });
  });

  // copy buttons
  grid.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-copy');
      const err = ALL_ERRORS.find(x => x.id === id);
      if (!err) return;
      const blob = JSON.stringify(err, null, 2);
      try {
        await navigator.clipboard.writeText(blob);
        btn.textContent = '✓ Copiado';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copiar JSON'; btn.classList.remove('copied'); }, 1800);
      } catch {
        btn.textContent = 'Sin portapapeles';
        setTimeout(() => { btn.textContent = 'Copiar JSON'; }, 1800);
      }
    });
  });
}

/* ============================================================
   LISTENERS + INIT
   ============================================================ */
if (searchInput) {
  searchInput.addEventListener('input', () => {
    state.search = searchInput.value;
    render();
  });
}
if (expandAll) {
  expandAll.addEventListener('click', () => {
    grid.querySelectorAll('.error-card').forEach(card => {
      card.classList.add('expanded');
      card.setAttribute('aria-expanded', 'true');
    });
  });
}
if (collapseAll) {
  collapseAll.addEventListener('click', () => {
    grid.querySelectorAll('.error-card').forEach(card => {
      card.classList.remove('expanded');
      card.setAttribute('aria-expanded', 'false');
    });
  });
}

updateStats();
buildFilters();
render();







</script>
</body>
</html>
