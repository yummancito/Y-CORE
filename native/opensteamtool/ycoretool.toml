# YCoreTool configuration
# Auto-generated by Y-core Electron app

[log]
level = "debug"

[manifest]
url = "wudrm"
timeout_resolve_ms = 5000
timeout_connect_ms = 5000
timeout_send_ms = 10000
timeout_recv_ms = 10000

[stats]
enable_api = false

[cloud]
enabled = false

[remote]
# Enable automatic download of IPC specs from GitHub
# YCoreTool will fetch missing specs for steam client versions on demand
url_template = "https://fast.jsdelivr.net/gh/OpenSteam001/steam-monitor@ipc/{component}/{sha256}.toml"
