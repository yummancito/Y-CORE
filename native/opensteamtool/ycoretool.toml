# OpenSteamTool configuration
# Auto-generated by Y-core Electron app
# NOTE: OpenSteamTool was renamed from YCoreTool. The 1.4.x DLL reads this
# file as opensteamtool.toml from the Steam root; Y-Core writes BOTH names
# (ycoretool.toml + opensteamtool.toml) so any deployed build finds it.

[log]
level = "debug"

[manifest]
url = "wudrm"
timeout_resolve_ms = 5000
timeout_connect_ms = 5000
timeout_send_ms = 10000
timeout_recv_ms = 10000

[stats]
enable_api = false

[cloud]
enabled = false

[remote]
# Enable automatic download of pattern/IPC specs from GitHub
# OpenSteamTool will fetch missing specs for steam client versions on demand.
# {channel} = pattern | ipc, matching the branch names in the steam-monitor repo.
url_template = "https://raw.githubusercontent.com/OpenSteam001/steam-monitor/{channel}/{component}/{sha256}.toml"
