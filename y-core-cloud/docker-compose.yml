name: y-core-cloud

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ycore
      POSTGRES_PASSWORD: ycore_dev_password
      POSTGRES_DB: ycore_cloud
    volumes:
      - ycore_cloud_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ycore -d ycore_cloud']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ycore_cloud_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ycore_cloud_pg_data:
  ycore_cloud_redis_data:
